# Tagging v<version> builds the XPI and attaches it to a GitHub release, at the
# address updates.json announces to Zotero.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --xpi
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.xpi"
          generate_release_notes: true
