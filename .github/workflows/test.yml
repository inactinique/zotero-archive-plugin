# The logic and the page are tested in Node on the three platforms Zotero runs
# on, and the plugin is packaged on each, to catch anything platform-specific
# in the build. Zotero itself is not driven here.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --xpi
      - uses: actions/upload-artifact@v4
        with:
          name: xpi-${{ matrix.os }}
          path: "*.xpi"
